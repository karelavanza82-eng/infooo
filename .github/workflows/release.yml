
name: Release

on:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build HOISLY APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          name=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^\s*versionCode\s*=\s*([0-9]+).*/\1/p' app/build.gradle.kts)

          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Version not found"
            exit 1
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$name" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || ! git ls-remote --exit-code --tags origin "refs/tags/v$name" > /dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.version.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.build == 'true'
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.build == 'true'
        with:
          cache-read-only: true

      - name: Raise Gradle memory limits
        if: steps.version.outputs.build == 'true'
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          kotlin.daemon.jvmargs=-Xmx3g
          org.gradle.workers.max=4
          EOF

      - name: Restore signing keystore
        if: steps.version.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.HOISLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing HOISLY_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "HOISLY_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test and build release APK
        if: steps.version.outputs.build == 'true'
        env:
          HOISLY_KEYSTORE_PASSWORD: ${{ secrets.HOISLY_KEYSTORE_PASSWORD }}
          HOISLY_KEY_ALIAS: ${{ secrets.HOISLY_KEY_ALIAS }}
          HOISLY_KEY_PASSWORD: ${{ secrets.HOISLY_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Prepare APK
        if: steps.version.outputs.build == 'true'
        run: |
          mkdir -p dist
          apk="Hoisly-Launcher-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk"
          cd dist
          sha256sum "$apk" > "$apk.sha256"

      - name: Upload APK to Actions
        if: steps.version.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HOISLY-Launcher-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          apk="Hoisly-Launcher-$NAME.apk"
          {
            echo "**Hoisly Launcher $NAME** (versionCode $CODE)"
            echo
            echo "SHA-256:"
            echo '```'
            cat "dist/$apk.sha256"
            echo '```'
          } > notes.md

          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Hoisly Launcher $NAME" \
            --notes-file notes.md \
            --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
        
