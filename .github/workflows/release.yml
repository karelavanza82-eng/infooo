name: Release

on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/release.yml'
      - 'app/src/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)

          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::versionName or versionCode not found"
            exit 1
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

          echo "Building Hiosly $name"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools, build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          kotlin.daemon.jvmargs=-Xmx3g
          org.gradle.workers.max=4
          EOF

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HOISLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::HOISLY_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::Keystore is empty or invalid"
            exit 1
          fi

          echo "HOISLY_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Verify signing certificate
        env:
          HOISLY_KEYSTORE_PASSWORD: ${{ secrets.HOISLY_KEYSTORE_PASSWORD }}
        run: |
          ACTUAL=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" \
            -storetype PKCS12 \
            -storepass "$HOISLY_KEYSTORE_PASSWORD" 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr '[:lower:]' '[:upper:]')
          EXPECTED="9C:E7:0E:68:AF:5F:3E:F4:F5:16:5C:29:61:3B:65:ED:38:F4:D6:00:6E:22:11:76:DB:95:15:61:94:A0:68:26"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate does not match the installed HOISLY certificate"
            exit 1
          fi
          echo "Signing certificate matches installed HOISLY app."

      - name: Test and build release APK
        env:
          HOISLY_KEYSTORE_PASSWORD: ${{ secrets.HOISLY_KEYSTORE_PASSWORD }}
          HOISLY_KEY_ALIAS: ${{ secrets.HOISLY_KEY_ALIAS }}
          HOISLY_KEY_PASSWORD: ${{ secrets.HOISLY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not generated"
            find app/build/outputs -type f
            exit 1
          fi

          ls -lh "$APK"

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the installed Android build-tools"
            exit 1
          fi

          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]')
          EXPECTED="9C:E7:0E:68:AF:5F:3E:F4:F5:16:5C:29:61:3B:65:ED:38:F4:D6:00:6E:22:11:76:DB:95:15:61:94:A0:68:26"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Built APK signing certificate does not match installed HOISLY app"
            exit 1
          fi

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist

          APK="HOISLY-${VERSION}.apk"

          cp app/build/outputs/apk/release/app-release.apk "dist/$APK"

          cd dist
          sha256sum "$APK" > "$APK.sha256"

          ls -lh

      # Direct download from GitHub Actions
      - name: Upload APK for direct download
        uses: actions/upload-artifact@v4
        with:
          name: HOISLY-${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # Publish APK to GitHub Releases
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          APK="HOISLY-${VERSION}.apk"

          {
            echo "**HOISLY ${VERSION}**"
            echo
            echo "Version code: ${CODE}"
            echo
            echo "Release APK is available below."
            echo
            echo "SHA-256:"
            echo '```'
            cat "dist/${APK}.sha256"
            echo '```'
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists. Updating APK assets..."

            gh release upload "$TAG" dist/* --clobber

            gh release edit "$TAG" \
              --title "HOISLY ${VERSION}" \
              --notes-file notes.md
          else
            echo "Creating new GitHub Release..."

            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "HOISLY ${VERSION}" \
              --notes-file notes.md \
              --generate-notes
          fi

          echo "Release published successfully!"

      - name: Remove signing keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
